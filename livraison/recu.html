<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>קבלה · Reçu</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    // Si un fichier ne charge pas (ancien cache, réseau), afficher un bandeau pour recharger
    window.addEventListener("error", function (e) {
      if (window.hopReady || document.getElementById("loadError") || !document.body) return;
      var d = document.createElement("div");
      d.id = "loadError";
      d.style.cssText = "position:fixed;inset-inline:0;top:0;z-index:99;background:#F04438;color:#fff;padding:12px 16px;font:600 14px Arial;display:flex;gap:10px;align-items:center;justify-content:space-between";
      d.innerHTML = "<span>⚠️ Mise à jour en cours · עדכון בתהליך</span><button style='border:0;border-radius:10px;padding:8px 12px;font-weight:700'>↻ Recharger · רענון</button>";
      d.querySelector("button").onclick = function () {
        var go = function () { location.replace(location.pathname + "?r=" + Date.now() + location.hash); };
        if (window.caches && caches.keys) caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }).then(go, go); else go();
      };
      document.body.appendChild(d);
      console.error(e.message);
    });
  </script>
  <link rel="stylesheet" href="styles.css?v=202610191853" />
</head>
<body class="receipt-page">
  <main class="wrap narrow" style="padding:20px 16px 40px">
    <div class="receipt card" id="receipt"></div>
    <div class="no-print" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px">
      <button class="btn btn-primary" onclick="window.print()">🖨️ הדפסה / PDF · Imprimer</button>
      <a class="btn" href="index.html#mes-courses">← Retour · חזרה</a>
    </div>
  </main>
  <script src="config.js?v=202610191853"></script>

  <script src="recu.js?v=202610191853"></script>
</body>
</html>
