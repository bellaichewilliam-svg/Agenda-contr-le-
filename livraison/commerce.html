<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#141C2E" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="Commerçants de Netanya : livrez vos clients à prix fixe, sans commission sur vos ventes. בעלי עסקים בנתניה: משלוחים ללקוחות במחיר קבוע, בלי עמלה על המכירות." />
  <meta property="og:title" content="HOP! Commerces · הופ! לעסקים" />
  <meta property="og:description" content="0 % de commission sur vos ventes, le livreur arrive quand la commande est prête, votre QR code pour vos clients. 0% עמלה על המכירות, השליח מגיע כשההזמנה מוכנה, קוד QR ללקוחות." />
  <meta property="og:type" content="website" />
  <title>HOP! Pro · הופ! לעסקים</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="HOP!" />
  <link rel="icon" href="logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    // Si l'application ne démarre pas (ancien cache, fichier manquant pendant une mise à jour),
    // afficher un bandeau pour recharger. Les erreurs venues d'ailleurs (scripts ajoutés par le
    // navigateur, extensions) n'affichent rien tant que l'application a bien démarré.
    (function () {
      var first = "";
      function show() {
        if (window.hopReady || document.getElementById("loadError") || !document.body) return;
        var d = document.createElement("div");
        d.id = "loadError";
        d.style.cssText = "position:fixed;inset-inline:0;top:0;z-index:99;background:#F04438;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;font:600 14px Arial;display:flex;gap:10px;align-items:center;justify-content:space-between";
        d.innerHTML = "<span>⚠️ Mise à jour en cours · עדכון בתהליך<small style='display:block;font-weight:400;opacity:.8;font-size:11px;margin-top:2px'></small></span><button style='border:0;border-radius:10px;padding:8px 12px;font-weight:700;color:#0F1F3D;background:#fff'>↻ Recharger · רענון</button>";
        d.querySelector("small").textContent = first;
        d.querySelector("button").onclick = function () {
          var go = function () { location.replace(location.pathname + "?r=" + Date.now() + location.hash); };
          if (window.caches && caches.keys) caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }).then(go, go); else go();
        };
        document.body.appendChild(d);
      }
      function later() { setTimeout(show, 2500); }
      window.addEventListener("error", function (e) {
        if (window.hopReady) return;
        if (!first) first = String(e.message || "erreur").slice(0, 120) + (e.filename ? " · " + String(e.filename).split("/").pop().split("?")[0] + ":" + (e.lineno || 0) : "");
        console.error(e.message);
        if (document.readyState === "complete") later();
      });
      window.addEventListener("load", function () { if (first) later(); });
    })();
  </script>
  <link rel="stylesheet" href="styles.css?v=202611010026" />
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="logo" href="index.html"><img class="logo-mark" src="logo.svg" alt="" /><span class="logo-name wordmark" id="brandName"></span></a>
    <nav class="nav">
      <button class="lang-btn" id="langBtn" data-i18n="langSwitch"></button>
    </nav>
  </div>
</header>

<main class="wrap shop-page">

  <!-- Présentation + inscription -->
  <section id="shopSignup" class="hidden">
    <p class="notice hidden" id="shopHave" style="margin-bottom:12px"></p>
    <!-- Page de présentation : les deux formules (Gratuit / HOP! Pro), comparaison, calcul, questions -->
    <div class="sl" id="shopLanding"></div>
    <form class="card sl-form" id="shopForm" action="javascript:void(0)" novalidate>
      <h2 data-i18n="shFormTitle"></h2>
      <div class="sl-pick" id="shopPlan" role="radiogroup"></div>
      <p class="notice hidden" id="refOk" data-i18n="shRefOk" style="margin:8px 0"></p>
      <div class="fields" style="margin-top:12px">
        <label class="f wide"><span data-i18n="shName"></span><input name="name" required autocomplete="organization" data-i18n-ph="shNamePh" /></label>
        <label class="f"><span data-i18n="shAddr"></span><input name="address" required data-i18n-ph="shAddrPh" /></label>
        <label class="f f-no"><span data-i18n="shNo"></span><input name="number" inputmode="numeric" /></label>
        <label class="f"><span data-i18n="shCity"></span><select name="city" id="shopCity"></select></label>
        <label class="f"><span data-i18n="shKind"></span><select name="kind" id="shopKind"></select></label>
        <label class="f"><span data-i18n="shContact"></span><input name="contact_name" autocomplete="name" /></label>
        <label class="f"><span data-i18n="shPhone"></span><input name="phone" type="tel" required autocomplete="tel" placeholder="05X-XXX-XXXX" /></label>
        <label class="f"><span data-i18n="shEmail"></span><input name="email" type="email" autocomplete="email" /></label>
        <label class="f"><span data-i18n="shRef"></span><input name="ref_code" autocapitalize="characters" dir="ltr" /></label>
      </div>
      <!-- Infos de base pour les clients (facultatif) : logo, photo, accroche, présentation, WhatsApp, horaires -->
      <div class="sg-extra" id="shopExtra"></div>
      <div class="pay-choice hidden" id="shopPay" style="margin-top:14px"></div>
      <p class="notice err hidden" id="shopError" style="margin-top:12px"></p>
      <button class="btn btn-primary btn-block btn-lg" id="shopSubmit" style="margin-top:14px" data-i18n="shSubmit"></button>
    </form>
  </section>

  <!-- Espace du commerce -->
  <section id="shopSpace" class="hidden">
    <!-- En-tête façon appli : couverture, logo, nom, abonnement, chiffres du mois -->
    <div class="sp-head">
      <div id="spHeadTop"></div>
      <div class="sp-stats">
        <div><b id="spMonth">0</b><small data-i18n="shStatsMonth"></small></div>
        <div><b id="spSpent">0</b><small data-i18n="shStatsSpent"></small></div>
        <div><b id="spAll">0</b><small data-i18n="shStatsAll"></small></div>
      </div>
    </div>
    <nav class="sp-tabs" id="spTabs" role="tablist">
      <button type="button" data-sp-tab="orders"><i>🛎️</i><span data-i18n="spTabOrders"></span><em class="sp-badge hidden" id="spBadge"></em></button>
      <button type="button" data-sp-tab="catalog"><i>🛍️</i><span data-i18n="spTabCatalog"></span></button>
      <button type="button" data-sp-tab="shop"><i>🎨</i><span data-i18n="spTabShop"></span></button>
      <button type="button" data-sp-tab="account"><i>⚙️</i><span data-i18n="spTabAccount"></span></button>
    </nav>
    <div class="sp-pane" data-sp-pane="orders">
      <div class="card prep-card hidden" id="spPrep"></div>
      <div class="card drops-card hidden" id="spDrops"></div>
      <!-- « Envoyer une course » : le client a acheté au magasin, HOP! lui livre (toutes ses infos obligatoires) -->
      <button type="button" class="btn btn-primary btn-lg btn-block" id="spOrder" data-i18n="shOrder"></button>
      <p class="muted small" style="margin:6px 0 16px;text-align:center" id="spOrderSub"></p>
      <form class="card sd-card hidden" id="spSend" action="javascript:void(0)" novalidate></form>
      <div class="card">
        <h3 data-i18n="shOrders"></h3>
        <div id="spOrders"></div>
      </div>
    </div>
    <div class="sp-pane" data-sp-pane="catalog">
      <div class="card catalog-card hidden" id="spCatalog"></div>
    </div>
    <div class="sp-pane" data-sp-pane="shop">
      <details class="sp-fold" open><summary></summary><div class="card brand-card hidden" id="spBrand"></div></details>
      <details class="sp-fold"><summary></summary><div class="card hidden" id="spPage"></div></details>
      <details class="sp-fold"><summary></summary><div class="card hidden" id="spStats"></div></details>
      <details class="sp-fold"><summary></summary><div class="card hidden" id="spClients"></div></details>
      <details class="sp-fold"><summary></summary><div class="card fiche-card" id="spFiche"></div></details>
      <details class="sp-fold"><summary></summary><div class="card" id="spLinkCard">
        <h3 data-i18n="shLinkTitle"></h3>
        <p class="muted small" style="margin:4px 0 10px" data-i18n="shLinkSub"></p>
        <div class="promo-row"><input readonly id="spLink" dir="ltr" /><button class="btn btn-sm" id="spCopy" data-i18n="shCopy"></button><a class="btn btn-sm btn-wa" id="spShare" target="_blank" rel="noopener" data-i18n="shShare"></a></div>
        <div class="poster" id="poster">
          <img src="logo.svg" alt="" class="poster-logo" />
          <b data-i18n="shPoster"></b>
          <div class="qr" id="spQr"></div>
          <span id="posterName"></span>
          <small data-i18n="shPosterSub"></small>
        </div>
        <button class="btn" id="spPrint" data-i18n="shPrint"></button>
        <a class="btn" href="autocollant.html" target="_blank" rel="noopener" data-i18n="shSticker"></a>
      </div></details>
    </div>
    <div class="sp-pane" data-sp-pane="account">
      <div class="card paymeans-card" id="spPayMeans"></div>
      <div class="card plan-card" style="margin-top:14px" id="spPlan"></div>
      <div class="card pay-choice" style="margin-top:14px" id="spPay"></div>
      <div class="card pro-card" style="margin-top:14px" id="spPro"></div>
      <details class="card guide-card" style="margin-top:14px" id="spGuide"><summary id="spGuideTitle"></summary><ol id="spGuideSteps"></ol></details>
      <p class="notice" style="margin-top:14px" data-i18n="shKeep"></p>
      <div class="card" style="margin-top:14px" id="spOther">
        <a class="btn btn-block" href="commerce.html?inscription=1" data-i18n="shAnother"></a>
        <button type="button" class="btn btn-block btn-link danger" style="margin-top:8px" data-forget data-i18n="shForget"></button>
      </div>
    </div>
  </section>

  <p class="notice err hidden" id="shopGone" data-i18n="shUnknown"></p>
</main>
<a class="sl-sticky hidden" id="slSticky" href="#shopForm" data-i18n="slSticky"></a>

<button type="button" class="wa-fab chat-fab" id="waFab"><span>💬</span><b data-i18n="chatFab"></b><i class="chat-badge hidden" id="fabBadge"></i></button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js?v=202611010026"></script>
<script src="i18n.js?v=202611010026"></script>
<script src="pricing.js?v=202611010026"></script>
<script src="store.js?v=202611010026"></script>
<script src="chat.js?v=202611010026"></script>
<script src="common.js?v=202611010026"></script>
<script src="places.js?v=202611010026"></script>
<script src="commerce.js?v=202611010026"></script>
</body>
</html>
