<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0F1F3D" />
  <meta name="description" content="Commerçants de Netanya : livrez vos clients à prix fixe, sans commission sur vos ventes. בעלי עסקים בנתניה: משלוחים ללקוחות במחיר קבוע, בלי עמלה על המכירות." />
  <meta property="og:title" content="HOP! Commerces · הופ! לעסקים" />
  <meta property="og:description" content="0 % de commission sur vos ventes, un livreur en moins d'une heure, votre QR code pour vos clients. 0% עמלה, שליח תוך שעה, QR ללקוחות." />
  <meta property="og:type" content="website" />
  <title>HOP! Pro · הופ! לעסקים</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="logo.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    // Si un fichier ne charge pas (ancien cache, réseau), afficher un bandeau pour recharger
    window.addEventListener("error", function (e) {
      if (window.hopReady || document.getElementById("loadError") || !document.body) return;
      var d = document.createElement("div");
      d.id = "loadError";
      d.style.cssText = "position:fixed;inset-inline:0;top:0;z-index:99;background:#F04438;color:#fff;padding:12px 16px;font:600 14px Arial;display:flex;gap:10px;align-items:center;justify-content:space-between";
      d.innerHTML = "<span>⚠️ Mise à jour en cours · עדכון בתהליך</span><button style='border:0;border-radius:10px;padding:8px 12px;font-weight:700'>↻ Recharger · רענון</button>";
      d.querySelector("button").onclick = function () {
        var go = function () { location.replace(location.pathname + "?r=" + Date.now() + location.hash); };
        if (window.caches && caches.keys) caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }).then(go, go); else go();
      };
      document.body.appendChild(d);
      console.error(e.message);
    });
  </script>
  <link rel="stylesheet" href="styles.css?v=202610191540" />
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="logo" href="index.html"><img class="logo-mark" src="logo.svg" alt="" /><span class="logo-name wordmark" id="brandName"></span></a>
    <nav class="nav">
      <button class="lang-btn" id="langBtn" data-i18n="langSwitch"></button>
    </nav>
  </div>
</header>

<main class="wrap shop-page">

  <!-- Présentation + inscription -->
  <section id="shopSignup" class="hidden">
    <div class="shop-hero">
      <h1 data-i18n="shTitle"></h1>
      <p data-i18n="shLead"></p>
      <ul class="perks-list" id="shopPerks"></ul>
    </div>
    <form class="card" id="shopForm" action="javascript:void(0)" novalidate>
      <h2 data-i18n="shFormTitle"></h2>
      <p class="notice hidden" id="refOk" data-i18n="shRefOk" style="margin:8px 0"></p>
      <div class="fields" style="margin-top:12px">
        <label class="f wide"><span data-i18n="shName"></span><input name="name" required autocomplete="organization" data-i18n-ph="shNamePh" /></label>
        <label class="f"><span data-i18n="shAddr"></span><input name="address" required data-i18n-ph="shAddrPh" /></label>
        <label class="f f-no"><span data-i18n="shNo"></span><input name="number" inputmode="numeric" /></label>
        <label class="f"><span data-i18n="shCity"></span><select name="city" id="shopCity"></select></label>
        <label class="f"><span data-i18n="shKind"></span><select name="kind" id="shopKind"></select></label>
        <label class="f"><span data-i18n="shContact"></span><input name="contact_name" autocomplete="name" /></label>
        <label class="f"><span data-i18n="shPhone"></span><input name="phone" type="tel" required autocomplete="tel" placeholder="05X-XXX-XXXX" /></label>
        <label class="f"><span data-i18n="shEmail"></span><input name="email" type="email" autocomplete="email" /></label>
        <label class="f"><span data-i18n="shRef"></span><input name="ref_code" autocapitalize="characters" dir="ltr" /></label>
      </div>
      <p class="notice err hidden" id="shopError" style="margin-top:12px"></p>
      <button class="btn btn-primary btn-block btn-lg" id="shopSubmit" style="margin-top:14px" data-i18n="shSubmit"></button>
    </form>
  </section>

  <!-- Espace du commerce -->
  <section id="shopSpace" class="hidden">
    <div class="shop-hero">
      <h1 id="spTitle"></h1>
      <p id="spStatus"></p>
    </div>
    <a class="btn btn-primary btn-lg btn-block" id="spOrder" data-i18n="shOrder"></a>
    <p class="muted small" style="margin:6px 0 16px;text-align:center" data-i18n="shOrderSub"></p>
    <div class="stats">
      <div class="stat"><small data-i18n="shStatsMonth"></small><b id="spMonth">0</b></div>
      <div class="stat"><small data-i18n="shStatsSpent"></small><b id="spSpent">0</b></div>
      <div class="stat"><small data-i18n="shStatsAll"></small><b id="spAll">0</b></div>
    </div>
    <div class="card pro-card" style="margin-top:14px" id="spPro"></div>
    <div class="card" style="margin-top:14px">
      <h3 data-i18n="shLinkTitle"></h3>
      <p class="muted small" style="margin:4px 0 10px" data-i18n="shLinkSub"></p>
      <div class="promo-row"><input readonly id="spLink" dir="ltr" /><button class="btn btn-sm" id="spCopy" data-i18n="shCopy"></button><a class="btn btn-sm btn-wa" id="spShare" target="_blank" rel="noopener" data-i18n="shShare"></a></div>
      <div class="poster" id="poster">
        <img src="logo.svg" alt="" class="poster-logo" />
        <b data-i18n="shPoster"></b>
        <div class="qr" id="spQr"></div>
        <span id="posterName"></span>
        <small data-i18n="shPosterSub"></small>
      </div>
      <button class="btn" id="spPrint" data-i18n="shPrint"></button>
    </div>
    <div class="card" style="margin-top:14px">
      <h3 data-i18n="shOrders"></h3>
      <div id="spOrders"></div>
    </div>
    <p class="notice" style="margin-top:14px" data-i18n="shKeep"></p>
  </section>

  <p class="notice err hidden" id="shopGone" data-i18n="shUnknown"></p>
</main>

<button type="button" class="wa-fab chat-fab" id="waFab"><span>💬</span><b data-i18n="chatFab"></b><i class="chat-badge hidden" id="fabBadge"></i></button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js?v=202610191540"></script>
<script src="i18n.js?v=202610191540"></script>
<script src="pricing.js?v=202610191540"></script>
<script src="store.js?v=202610191540"></script>
<script src="chat.js?v=202610191540"></script>
<script src="common.js?v=202610191540"></script>
<script src="places.js?v=202610191540"></script>
<script src="commerce.js?v=202610191540"></script>
</body>
</html>
