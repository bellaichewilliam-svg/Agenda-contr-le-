  <script>
    // Si un fichier ne charge pas (ancien cache, réseau), afficher un bandeau pour recharger
    window.addEventListener("error", function (e) {
      if (window.hopReady || document.getElementById("loadError") || !document.body) return;
      var d = document.createElement("div");
      d.id = "loadError";
      d.style.cssText = "position:fixed;inset-inline:0;top:0;z-index:99;background:#F04438;color:#fff;padding:12px 16px;font:600 14px Arial;display:flex;gap:10px;align-items:center;justify-content:space-between";
      d.innerHTML = "<span>⚠️ Mise à jour en cours · עדכון בתהליך</span><button style='border:0;border-radius:10px;padding:8px 12px;font-weight:700'>↻ Recharger · רענון</button>";
      d.querySelector("button").onclick = function () {
        var go = function () { location.replace(location.pathname + "?r=" + Date.now() + location.hash); };
        if (window.caches && caches.keys) caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }).then(go, go); else go();
      };
      document.body.appendChild(d);
      console.error(e.message);
    });
  </script>

            <label class="f"><span data-i18n="time"></span><input type="time" name="time" step="900" /></label>
          </div>
          <p class="notice err hidden" id="scheduleError" style="margin-top:12px"></p>
        </fieldset>

        <fieldset>
          <legend id="pickupLegend" data-i18n="s2"></legend>
          <div class="fields">
            <label class="f full show-retrait"><span data-i18n="placeKind"></span>
              <select name="place_kind">
                <option value="poste" data-i18n="place_poste"></option>
                <option value="superpharm" data-i18n="place_superpharm"></option>
                <option value="relais" data-i18n="place_relais"></option>
                <option value="autre" data-i18n="place_autre"></option>
              </select>
            </label>
            <label class="f full"><span data-i18n="addrSearch"></span><input name="pickup_address" data-i18n-ph="addrSearchPh" /></label>
            <label class="f"><span data-i18n="houseNo"></span><input name="pickup_number" data-i18n-ph="houseNoPh" autocomplete="off" /></label>
            <label class="f"><span data-i18n="city"></span><select name="from_city" class="city-select with-other"></select></label>
            <label class="f other-city hidden" data-for="from"><span data-i18n="otherCityName"></span><input name="from_other" /></label>
            <label class="f full"><span data-i18n="addrNote"></span><input name="pickup_note" data-i18n-ph="addrNotePh" /></label>

            <label class="check full show-poste"><input type="checkbox" name="has_proxy" /> <span data-i18n="proxy"></span></label>
            <p class="notice warn full show-poste" data-i18n="proxyNote"></p>
            <label class="f full show-achat"><span data-i18n="shoppingList"></span><textarea name="shopping_list" rows="3" data-i18n-ph="shoppingListPh"></textarea></label>
            <label class="f show-achat"><span data-i18n="budget"></span><input name="budget" type="number" min="0" step="10" inputmode="numeric" /></label>
            <p class="notice full show-achat" data-i18n="budgetNote"></p>
            <label class="f hide-retrait"><span data-i18n="contactThere"></span><input name="pickup_contact" data-i18n-ph="namePh" /></label>

        </fieldset>

        <fieldset>

            <label class="f"><span data-i18n="recipient"></span><input name="dropoff_contact" data-i18n-ph="namePh" /></label>
            <label class="f"><span data-i18n="recipientPhone"></span><input name="dropoff_phone" type="tel" data-i18n-ph="phonePh" /></label>
          </div>
        </fieldset>


        <fieldset>
          <legend data-i18n="s5"></legend>
          <div class="choices three">
            <label class="choice"><input type="radio" name="size" value="petit" checked /><span><i>✉️</i><b data-i18n="sz_petit"></b><small data-i18n="sz_petit_d"></small></span></label>
            <label class="choice"><input type="radio" name="size" value="moyen" /><span><i>📦</i><b data-i18n="sz_moyen"></b><small data-i18n="sz_moyen_d"></small></span></label>
            <label class="choice"><input type="radio" name="size" value="gros" /><span><i>🧳</i><b data-i18n="sz_gros"></b><small data-i18n="sz_gros_d"></small></span></label>
          </div>
          <div class="fields" style="margin-top:12px">
            <label class="check full"><input type="checkbox" name="round_trip" /> <span data-i18n="roundTrip"></span></label>
            <label class="f"><span data-i18n="stops"></span><input name="extra_stops" type="number" min="0" max="10" value="0" inputmode="numeric" /></label>
            <label class="f full"><span data-i18n="notes"></span><textarea name="notes" rows="2" data-i18n-ph="notesPh"></textarea></label>
          </div>
        </fieldset>

        <fieldset>
          <legend data-i18n="s6"></legend>
          <div class="choices">
            <label class="choice"><input type="radio" name="payment_method" value="cash" checked /><span><i>💵</i><b data-i18n="pay_cash"></b><small data-i18n="pay_cash_d"></small></span></label>

          </div>
          <div class="fields" style="margin-top:12px">
            <label class="f full"><span data-i18n="payer"></span>
              <select name="payer"><option value="moi" data-i18n="payer_moi"></option><option value="destinataire" data-i18n="payer_dest"></option></select>
            </label>
            <div class="f full">
              <span data-i18n="promo"></span>
              <div class="promo-row">
                <input name="promo" data-i18n-ph="promoPh" autocapitalize="characters" />
                <button type="button" class="btn btn-sm" id="promoBtn" data-i18n="promoApply"></button>
              </div>
              <small id="promoMsg" class="promo-msg"></small>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend data-i18n="s7"></legend>
          <div class="fields">
            <label class="f"><span data-i18n="yourName"></span><input name="contact_name" autocomplete="name" /></label>
            <label class="f"><span data-i18n="yourPhone"></span><input name="contact_phone" type="tel" autocomplete="tel" /></label>
            <label class="f"><span data-i18n="company"></span><input name="company" autocomplete="organization" /></label>
            <label class="f"><span data-i18n="email"></span><input name="contact_email" type="email" autocomplete="email" /></label>
          </div>
          <p class="muted small" style="margin-top:10px" data-i18n="remember"></p>
        </fieldset>
      </div>

      <aside class="summary card" id="summary">
        <h3 style="margin-bottom:8px" data-i18n="summary"></h3>
        <ul id="quoteLines"></ul>
        <div class="total"><span data-i18n="total"></span><b id="quoteTotal">—</b></div>
        <p class="muted small" id="quoteNote" style="margin:8px 0 14px"></p>
        <p class="notice err hidden" id="formError" style="margin-bottom:12px"></p>
        <button class="btn btn-primary btn-block btn-lg" type="submit" id="submitBtn"></button>
      </aside>
    </form>
  </div>
</section>
