<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOP! · couleur des boutons</title>
<link href="https://fonts.googleapis.com/css2?family=Karantina:wght@700&family=Heebo:wght@500;600;700;800;900&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
<style>
/* Planche de choix pour le patron (24/11) : la couleur des boutons d'action de tout le site, dans la nouvelle identité */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Heebo, sans-serif; background: #E9E2D4; padding: 24px; }
h1 { font-weight: 900; font-size: 28px; color: #0F1F3D; } p.s { color: #5A6270; font-weight: 600; margin: 4px 0 18px; }
.grid { display: grid; grid-template-columns: repeat(3, 320px); gap: 22px; }
.opt { background: #F4ECDD; border-radius: 26px; overflow: hidden; box-shadow: 0 14px 30px rgba(15,31,61,.12); }
.lab { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: #fff; font-weight: 900; font-size: 16px; color: #0F1F3D; }
.lab i { width: 26px; height: 26px; border-radius: 13px; flex: none; } .lab small { margin-inline-start: auto; font-family: 'IBM Plex Mono'; font-size: 11px; color: #5A6270; }
.hero { background: #0F1F3D; color: #fff; padding: 16px 16px 18px; }
.hero .t { font-family: Karantina; font-size: 44px; line-height: .86; text-transform: uppercase; } .hero .t b { font-weight: 700; color: var(--hl); }
.search { display: flex; align-items: center; margin-top: 12px; padding: 6px 6px 6px 14px; border-radius: 26px; background: #F4ECDD; color: #6B6152; font-weight: 600; font-size: 13px; }
.search b { margin-inline-start: auto; padding: 9px 14px; border-radius: 20px; background: var(--on-dark-bg); color: var(--on-dark-fg); font-size: 13px; }
.body { padding: 14px 14px 16px; display: grid; gap: 12px; }
.prod { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 18px; padding: 10px; }
.prod .ph { width: 54px; height: 54px; border-radius: 14px; background: #F2B21B url(img/smashit/burger-royal.webp) center/80% no-repeat; }
.prod b { display: block; font-weight: 900; font-size: 14px; color: #0F1F3D; } .prod span { font-family: Karantina; font-size: 24px; color: var(--price); }
.plus { margin-inline-start: auto; width: 36px; height: 36px; border-radius: 18px; background: var(--btn); color: var(--btn-fg); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 22px; }
.chips { display: flex; gap: 6px; } .chip { padding: 7px 12px; border-radius: 16px; background: rgba(15,31,61,.08); font-weight: 800; font-size: 12px; color: #0F1F3D; } .chip.on { background: #0F1F3D; color: #fff; }
.cart { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border-radius: 26px; background: var(--btn); color: var(--btn-fg); font-weight: 800; font-size: 14px; }
.cart .n { width: 26px; height: 26px; border-radius: 13px; background: var(--btn-fg); color: var(--btn); display: flex; align-items: center; justify-content: center; font-weight: 900; }
.cart .go { margin-inline-start: auto; padding: 7px 12px; border-radius: 18px; background: var(--btn-in); color: var(--btn-in-fg); font-family: Karantina; font-size: 22px; line-height: .8; }
.cta { display: flex; justify-content: center; align-items: center; gap: 8px; padding: 14px; border-radius: 26px; background: var(--btn); color: var(--btn-fg); font-weight: 800; font-size: 15px; }
.cta .dot { width: 8px; height: 8px; border-radius: 4px; background: var(--dot, transparent); }
.nav { display: flex; justify-content: space-around; align-items: center; padding: 8px; border-radius: 24px; background: #0F1F3D; color: #9FB3D9; font-size: 10px; font-weight: 700; }
.nav .mic { width: 44px; height: 44px; border-radius: 22px; background: var(--mic); display: flex; align-items: center; justify-content: center; margin-top: -18px; box-shadow: 0 0 0 4px #0F1F3D; }
.nav .on { color: #fff; } .nav .on::after { content: ''; display: block; height: 3px; border-radius: 2px; background: var(--hl); margin-top: 3px; }
.reco { outline: 4px solid #0F1F3D; } .reco .lab::after { content: 'MON CONSEIL'; font-family: 'IBM Plex Mono'; font-size: 10px; padding: 4px 8px; border-radius: 8px; background: #0F1F3D; color: #fff; }
</style>
</head>
<body>
<h1>La couleur des boutons de HOP!</h1>
<p class="s">Même écran, 6 couleurs pour les boutons d'action (Ajouter, Commander, Chercher, le panier, le micro). Le reste ne change pas : bleu nuit, papier crème.</p>
<div class="grid" id="g"></div>
<script>
const O = [
  ['1 · Orange HOP! (actuel)', '#FF6A13', { btn: '#FF6A13', 'btn-fg': '#fff', 'btn-in': '#0F1F3D', 'btn-in-fg': '#fff', hl: '#FF6A13', price: '#FF6A13', mic: '#FF6A13', 'on-dark-bg': '#FF6A13', 'on-dark-fg': '#fff' }],
  ['2 · Orange brûlé', '#E2550D', { btn: '#E2550D', 'btn-fg': '#fff', 'btn-in': '#0F1F3D', 'btn-in-fg': '#fff', hl: '#FF7A2E', price: '#D24E0B', mic: '#E2550D', 'on-dark-bg': '#E2550D', 'on-dark-fg': '#fff' }],
  ['3 · Corail', '#FF5A4A', { btn: '#FF5A4A', 'btn-fg': '#fff', 'btn-in': '#0F1F3D', 'btn-in-fg': '#fff', hl: '#FF7A6C', price: '#E8483A', mic: '#FF5A4A', 'on-dark-bg': '#FF5A4A', 'on-dark-fg': '#fff' }],
  ['4 · Jaune étiquette', '#FFC933', { btn: '#FFC933', 'btn-fg': '#0F1F3D', 'btn-in': '#0F1F3D', 'btn-in-fg': '#FFC933', hl: '#FFC933', price: '#0F1F3D', mic: '#FFC933', 'on-dark-bg': '#FFC933', 'on-dark-fg': '#0F1F3D' }],
  ['5 · Bleu nuit, orange en touche', '#0F1F3D', { btn: '#0F1F3D', 'btn-fg': '#fff', 'btn-in': '#FF6A13', 'btn-in-fg': '#fff', hl: '#FF6A13', price: '#0F1F3D', mic: '#FF6A13', 'on-dark-bg': '#0F1F3D', 'on-dark-fg': '#fff', dot: '#FF6A13' }, true],
  ['6 · Vert « go »', '#14A06A', { btn: '#14A06A', 'btn-fg': '#fff', 'btn-in': '#0F1F3D', 'btn-in-fg': '#fff', hl: '#FF6A13', price: '#0E8A5A', mic: '#14A06A', 'on-dark-bg': '#14A06A', 'on-dark-fg': '#fff' }],
];
document.getElementById('g').innerHTML = O.map(([n, c, v, reco]) => `<div class="opt${reco ? ' reco' : ''}" style="${Object.entries(v).map(([k, x]) => `--${k}:${x}`).join(';')}">
  <div class="lab"><i style="background:${c}"></i>${n}<small>${c}</small></div>
  <div class="hero"><div class="t">On fait vos<br>courses <b>pour vous.</b></div><div class="search">Lait, pizza…<b>Chercher</b></div></div>
  <div class="body"><div class="chips"><span class="chip on">Burgers</span><span class="chip">À partager</span><span class="chip">Sauces</span></div>
    <div class="prod"><div class="ph"></div><div><b>Smash It Royal</b><span>56 ₪</span></div><span class="plus"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></div>
    <div class="cart"><span class="n">2</span>Voir le panier<span class="go">74 ₪</span></div>
    <div class="cta"><span class="dot"></span>Commander · 99 ₪</div>
    <div class="nav"><span class="on">Accueil</span><span>Restos</span><span class="mic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="2.5" width="6" height="11.5" rx="3" fill="#fff"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3.5"/></svg></span><span>Courses</span><span>Commandes</span></div></div></div>`).join('');
</script>
</body>
</html>
