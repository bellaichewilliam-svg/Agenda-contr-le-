<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOP! · palettes pleine couleur</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Rubik:wght@700;900&family=Heebo:wght@500;700;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
/* Planche des palettes « pleine couleur » (patron 24/11 : « propose-moi d'autres couleurs », « noir et bleu nuit ça va pas ») */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Heebo, sans-serif; background: #EFE7DA; padding: 24px; }
h1 { font: 800 30px 'Bricolage Grotesque', sans-serif; letter-spacing: -.03em; } p.s { font-weight: 700; color: #6b5d4f; margin: 4px 0 18px; }
.grid { display: grid; grid-template-columns: repeat(4, 300px); gap: 20px; }
.lab { font: 800 18px 'Bricolage Grotesque'; margin-bottom: 8px; letter-spacing: -.02em; } .lab small { display: block; font: 700 12px Heebo; color: #6b5d4f; }
.sw { display: flex; gap: 4px; margin-bottom: 8px; } .sw i { flex: 1; height: 16px; border-radius: 5px; }
.ph { width: 300px; height: 640px; border-radius: 34px; overflow: hidden; position: relative; background: var(--cream); box-shadow: 0 20px 40px rgba(60,30,10,.18); }
.T { font-family: 'Bricolage Grotesque', Rubik, sans-serif; font-weight: 800; letter-spacing: -.035em; line-height: .92; }
.hero { position: relative; height: 330px; background: var(--c1); color: #fff; padding: 22px 18px; overflow: hidden; }
.logo { font: 900 24px Rubik; letter-spacing: -.04em; } .logo i { font-style: normal; color: var(--c2); }
.hero h2 { margin-top: 18px; font-size: 44px; } .hero .sc { font: 700 30px Caveat, cursive; color: var(--c2); margin-top: 2px; }
.bub { position: absolute; padding: 5px 11px; border-radius: 14px; font: 800 10px Heebo; text-transform: uppercase; letter-spacing: .03em; }
.btn { position: absolute; left: 18px; bottom: 54px; padding: 10px 18px; border-radius: 22px; background: #fff; color: var(--ink); font: 800 13px Heebo; }
.hop { position: absolute; right: -6px; bottom: 34px; height: 190px; filter: drop-shadow(0 14px 12px rgba(0,0,0,.25)); }
.badge { position: absolute; right: 14px; top: 16px; width: 64px; height: 64px; animation: spin 10s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.wave { position: absolute; left: 0; right: 0; bottom: -1px; height: 40px; }
.band { background: var(--ink); padding: 6px 0; overflow: hidden; transform: rotate(-2deg) scale(1.05); margin-top: -6px; position: relative; z-index: 2; }
.band div { display: flex; gap: 12px; white-space: nowrap; font: 800 17px 'Bricolage Grotesque'; letter-spacing: -.02em; animation: sl 14s linear infinite; width: max-content; }
.band span:nth-child(4n+1) { color: var(--c2); } .band span:nth-child(4n+2) { color: #fff; } .band span:nth-child(4n+3) { color: var(--c3); } .band span:nth-child(4n) { color: var(--c4); }
@keyframes sl { to { transform: translateX(-50%); } }
.promo { position: relative; height: 200px; background: var(--c2); margin-top: 8px; overflow: hidden; color: var(--ink); text-align: center; padding-top: 22px; }
.promo h3 { font-size: 30px; } .promo .row { position: absolute; left: 0; bottom: 6px; display: flex; gap: 14px; animation: sl 9s linear infinite; width: max-content; }
.promo .row img { height: 92px; filter: drop-shadow(0 10px 8px rgba(0,0,0,.25)); } .promo .tag { position: absolute; top: 60px; left: 50%; transform: translateX(-50%) rotate(-5deg); padding: 4px 10px; border-radius: 12px; background: var(--ink); color: #fff; font: 800 11px Heebo; }
.torn { position: absolute; left: 0; right: 0; top: -1px; height: 14px; }
.shop { position: relative; height: 112px; background: var(--c3); padding: 16px 18px; color: #fff; }
.shop b { font-size: 30px; display: block; } .shop span { font: 700 12px Heebo; opacity: .9; } .shop .go { position: absolute; right: 16px; bottom: 16px; width: 40px; height: 40px; border-radius: 20px; background: var(--ink); display: flex; align-items: center; justify-content: center; font: 900 18px Heebo; color: #fff; }
.nav { position: absolute; left: 10px; right: 10px; bottom: 10px; height: 52px; border-radius: 26px; background: var(--ink); display: flex; align-items: center; justify-content: space-around; color: rgba(255,255,255,.7); font: 700 9px Heebo; }
.nav .m { width: 46px; height: 46px; border-radius: 23px; background: var(--c1); margin-top: -18px; box-shadow: 0 0 0 4px var(--ink); }
.nav .on { color: #fff; }
.reco { outline: 4px solid var(--ink); }
</style>
</head>
<body>
<h1>Les couleurs de HOP! — pleine page</h1>
<p class="s">4 palettes, sans bleu nuit ni noir. Même écran à chaque fois : le grand bloc d'accueil, la bande de mots, les promos en slide, une boutique.</p>
<div class="grid" id="g"></div>
<script>
const P = [
  ['A · Capiá chaud', 'rouge tomate, moutarde, basilic (le plus proche de la vidéo)', { c1: '#E8452C', c2: '#F5B70F', c3: '#2F8F4E', c4: '#FF9A7A', ink: '#3B1F12', cream: '#FFF3DC' }, 1],
  ['B · Soleil de Netanya', 'orange HOP!, soleil, mer turquoise', { c1: '#FF6A13', c2: '#FFC93C', c3: '#13A8A0', c4: '#FFB3C7', ink: '#3A1E0E', cream: '#FFF6E8' }],
  ['C · Mer & agrumes', 'bleu azur vif, citron, corail', { c1: '#1E9BF0', c2: '#FFE14A', c3: '#FF6B57', c4: '#7ED9A6', ink: '#0B4A6F', cream: '#F4F9FF' }],
  ['D · Pop framboise', 'framboise, mandarine, soleil, lilas', { c1: '#FF3D7F', c2: '#FFD23F', c3: '#FF8A2B', c4: '#B79CFF', ink: '#3A1B4F', cream: '#FFF4F7' }],
];
const badge = c => `<svg class="badge" viewBox="0 0 100 100"><defs><path id="cp" d="M50 50 m-38 0 a38 38 0 1 1 76 0 a38 38 0 1 1 -76 0"/></defs><circle cx="50" cy="50" r="49" fill="#fff"/><text font-family="Heebo" font-weight="800" font-size="11" fill="${c}" letter-spacing="2"><textPath href="#cp">LIVRÉ AU PLUS VITE · NETANYA ·</textPath></text><text x="50" y="58" text-anchor="middle" font-family="Rubik" font-weight="900" font-size="22" fill="${c}">HOP!</text></svg>`;
document.getElementById('g').innerHTML = P.map(([n, s, v, reco]) => `<div><div class="lab">${n}<small>${s}</small></div><div class="sw">${['c1', 'c2', 'c3', 'c4', 'ink'].map(k => `<i style="background:${v[k]}"></i>`).join('')}</div>
  <div class="ph" style="${Object.entries(v).map(([k, x]) => `--${k}:${x}`).join(';')}">
    <div class="hero"><div class="logo">HOP<i>!</i></div>${badge(v.c1)}
      <h2 class="T">On fait vos<br>courses</h2><div class="sc">pour vous, promis</div>
      <span class="bub" style="left:150px;top:96px;background:${v.c3};color:#fff;transform:rotate(-6deg)">au plus vite</span>
      <span class="bub" style="left:18px;top:200px;background:#fff;color:${v.ink};transform:rotate(4deg)">dès 25 ₪ en ville</span>
      <img class="hop" src="img/v4/hoppy.webp" alt=""><span class="btn">Commander ›</span>
      <svg class="wave" viewBox="0 0 300 40" preserveAspectRatio="none"><path d="M0 26 C 80 0, 170 44, 300 10 L300 40 L0 40 Z" fill="${v.cream}"/></svg></div>
    <div class="band"><div>${'<span>Courses</span><span>Restos</span><span>Pharmacie</span><span>Au plus vite</span><span>Promos</span><span>Netanya</span>'.repeat(4)}</div></div>
    <div class="promo"><svg class="torn" viewBox="0 0 300 14" preserveAspectRatio="none"><path d="M0 0H300V6L290 12 278 5 265 13 250 6 236 12 222 4 208 12 194 6 180 13 166 5 152 12 138 6 124 13 110 5 96 12 82 6 68 13 54 5 40 12 26 6 12 13 0 6Z" fill="${v.cream}"/></svg>
      <h3 class="T">Toutes les promos</h3><span class="tag">jusqu'à −50 %</span>
      <div class="row">${['lait', 'coca', 'bamba', 'pommes', 'chips', 'baguette'].map(k => `<img src="img/v4/${k}.webp" alt="">`).join('').repeat(2)}</div></div>
    <div class="shop"><b class="T">Smash It</b><span>Burgers casher · dès 25 ₪</span><span class="go">›</span></div>
    <div class="nav"><span class="on">Accueil</span><span>Magasins</span><span class="m"></span><span>Commandes</span><span>Compte</span></div>
  </div></div>`).join('');
</script>
</body>
</html>
