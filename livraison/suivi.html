  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="HOP!" />
  <link rel="icon" href="logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script>
    // Si l'application ne démarre pas (ancien cache, fichier manquant pendant une mise à jour),
    // afficher un bandeau pour recharger. Les erreurs venues d'ailleurs (scripts ajoutés par le
    // navigateur, extensions) n'affichent rien tant que l'application a bien démarré.
    (function () {
      var first = "";
      function show() {
        if (window.hopReady || document.getElementById("loadError") || !document.body) return;
        var d = document.createElement("div");
        d.id = "loadError";
        d.style.cssText = "position:fixed;inset-inline:0;top:0;z-index:99;background:#F04438;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;font:600 14px Arial;display:flex;gap:10px;align-items:center;justify-content:space-between";
        d.innerHTML = "<span>⚠️ Mise à jour en cours · עדכון בתהליך<small style='display:block;font-weight:400;opacity:.8;font-size:11px;margin-top:2px'></small></span><button style='border:0;border-radius:10px;padding:8px 12px;font-weight:700;color:#0F1F3D;background:#fff'>↻ Recharger · רענון</button>";
        d.querySelector("small").textContent = first;
        d.querySelector("button").onclick = function () {
          var go = function () { location.replace(location.pathname + "?r=" + Date.now() + location.hash); };
          if (window.caches && caches.keys) caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }).then(go, go); else go();
        };
        document.body.appendChild(d);
      }
      function later() { setTimeout(show, 2500); }
      window.addEventListener("error", function (e) {
        if (window.hopReady) return;
        if (!first) first = String(e.message || "erreur").slice(0, 120) + (e.filename ? " · " + String(e.filename).split("/").pop().split("?")[0] + ":" + (e.lineno || 0) : "");
        console.error(e.message);
        if (document.readyState === "complete") later();
      });
      window.addEventListener("load", function () { if (first) later(); });
    })();
  </script>
  <link rel="stylesheet" href="styles.css?v=202610200852" />
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="logo" href="index.html"><img class="logo-mark" src="logo.svg" alt="" /><span class="logo-name wordmark" id="brandName"></span></a>
    <nav class="nav">
      <a href="index.html#mes-courses" data-i18n="navMine"></a>
      <button class="lang-btn" id="langBtn" data-i18n="langSwitch"></button>
    </nav>
  </div>
</header>

<main class="track-page">
  <div id="map"></div>
  <div class="eta-ring hidden" id="etaRing" aria-live="polite"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" class="bg" /><circle cx="50" cy="50" r="44" class="fg" id="etaArc" /></svg><b id="etaMin"></b><small id="etaUnit"></small></div>
  <div class="track-panel">
    <div class="eta" id="eta"><b data-i18n="trTitle"></b></div>
    <div class="eta-ask hidden" id="etaAsk"></div>
    <div class="card rate-card hidden" id="rateBox"></div>
    <div class="card rate-card hidden" id="tipBox"></div>
    <div class="confetti" id="confetti" aria-hidden="true"></div>
    <div class="card"><ol class="steps" id="steps"></ol></div>
    <div class="card kv" id="details"></div>
    <div class="card pay-box hidden" id="payBox"></div>
    <div class="card" id="courierBox">
      <h3 data-i18n="chatTitle"></h3>
      <p class="muted small hidden" id="noCourier" data-i18n="chatNoCourier"></p>
      <div class="chat-grid">
        <button type="button" class="btn btn-wa" id="chatBtn"><span data-i18n="chOpen"></span> <i class="chat-badge hidden" id="chatBadge"></i></button>
        <a class="btn hidden" id="callCourier"></a>
      </div>
      <a class="btn btn-sm btn-link" id="shareBtn" target="_blank" rel="noopener" data-i18n="trShare" style="margin-top:6px"></a>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

</body>
</html>
