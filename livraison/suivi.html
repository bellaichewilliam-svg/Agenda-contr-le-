<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0F1F3D" />
  <meta name="robots" content="noindex" />
  <title>Suivi · מעקב</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script>
    // Si un fichier ne charge pas (ancien cache, réseau), afficher un bandeau pour recharger
    window.addEventListener("error", function (e) {
      if (window.hopReady || document.getElementById("loadError") || !document.body) return;
      var d = document.createElement("div");
      d.id = "loadError";
      d.style.cssText = "position:fixed;inset-inline:0;top:0;z-index:99;background:#F04438;color:#fff;padding:12px 16px;font:600 14px Arial;display:flex;gap:10px;align-items:center;justify-content:space-between";
      d.innerHTML = "<span>⚠️ Mise à jour en cours · עדכון בתהליך</span><button style='border:0;border-radius:10px;padding:8px 12px;font-weight:700'>↻ Recharger · רענון</button>";
      d.querySelector("button").onclick = function () {
        var go = function () { location.replace(location.pathname + "?r=" + Date.now() + location.hash); };
        if (window.caches && caches.keys) caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }).then(go, go); else go();
      };
      document.body.appendChild(d);
      console.error(e.message);
    });
  </script>
  <link rel="stylesheet" href="styles.css?v=202610191553" />
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="logo" href="index.html"><img class="logo-mark" src="logo.svg" alt="" /><span class="logo-name wordmark" id="brandName"></span></a>
    <nav class="nav">
      <a href="index.html#mes-courses" data-i18n="navMine"></a>
      <button class="lang-btn" id="langBtn" data-i18n="langSwitch"></button>
    </nav>
  </div>
</header>

<main class="track-page">
  <div id="map"></div>
  <div class="track-panel">
    <div class="eta" id="eta"><b data-i18n="trTitle"></b></div>
    <div class="card"><ol class="steps" id="steps"></ol></div>
    <div class="card kv" id="details"></div>
    <div class="card pay-box hidden" id="payBox"></div>
    <div class="card" id="courierBox">
      <h3 data-i18n="chatTitle"></h3>
      <p class="muted small hidden" id="noCourier" data-i18n="chatNoCourier"></p>
      <div class="chat-grid">
        <button type="button" class="btn btn-wa" id="chatBtn"><span data-i18n="chOpen"></span> <i class="chat-badge hidden" id="chatBadge"></i></button>
        <a class="btn hidden" id="callCourier"></a>
      </div>
      <a class="btn btn-sm btn-link" id="shareBtn" target="_blank" rel="noopener" data-i18n="trShare" style="margin-top:6px"></a>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="config.js?v=202610191553"></script>
<script src="i18n.js?v=202610191553"></script>
<script src="pricing.js?v=202610191553"></script>
<script src="store.js?v=202610191553"></script>
  <script src="chat.js?v=202610191553"></script>
<script src="common.js?v=202610191553"></script>
<script src="suivi.js?v=202610191553"></script>
</body>
</html>
