name: Update prices daily

on:
  schedule:
    # Tous les jours à 06:00 UTC (= 09:00 Israël)
    - cron: "0 6 * * *"
  workflow_dispatch:  # déclenchement manuel depuis l'onglet Actions
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-prices.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run scraper
        working-directory: scripts
        run: python fetch_prices.py --out ../data --verbose
        continue-on-error: true

      # Boutique « HOP! chez Rami Lévy » : promos du jour (et tout le magasin une fois par semaine)
      - name: Promos Rami Lévy (HOP!)
        run: python scripts/ramilevy_promos.py
        continue-on-error: true

      # Boutique « HOP! chez Mahsanei Lahav » (Netanya, magasin 022 de Freshmarket) : promos du jour, tout le magasin une fois par semaine
      - name: Promos Mahsanei Lahav (HOP!)
        run: python scripts/ramilevy_promos.py --user freshmarket --chain 7290876100000 --store 022 --prefix lahav
        continue-on-error: true

      # Boutiques HOP! chez Yohananof (Netanya 030) et chez Osher Ad (Netanya 023) : même robot
      - name: Promos Yohananof (HOP!)
        run: python scripts/ramilevy_promos.py --user yohananof --chain 7290803800003 --store 030 --prefix yohananof
        continue-on-error: true

      - name: Promos Osher Ad (HOP!)
        run: python scripts/ramilevy_promos.py --user osherad --chain 7290103152017 --store 023 --prefix osherad --min-rows 3000
        continue-on-error: true

      - name: Promos Tiv Taam (HOP!)
        run: python scripts/ramilevy_promos.py --user TivTaam --chain 7290873255550 --store 002 --prefix tivtaam --min-rows 3000
        continue-on-error: true

      - name: Rebuild prixmalin.html
        run: bash build.sh

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data/raw-prices
          git add data/live-prices.json data/live-promotions.json data/raw-prices/ prixmalin.html 2>/dev/null || true
          git add livraison/data/ramilevy-promos.json livraison/data/ramilevy-prix.json livraison/data/lahav-prix.json livraison/data/lahav-promos.json livraison/data/yohananof-*.json livraison/data/osherad-*.json livraison/data/tivtaam-*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Pas de changement de prix."
          else
            git commit -m "chore(prices): mise à jour quotidienne $(date +%F)"
            git push
          fi
