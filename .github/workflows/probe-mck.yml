name: Essai Machsanei HaShuk

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Essai
        run: python scripts/mck_probe.py
        continue-on-error: true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add livraison/data/mck-probe.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "rien"; else git commit -m "chore: essai Machsanei HaShuk" && git push; fi
